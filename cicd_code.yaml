name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-2

jobs:

  build-test-python:
    name: Build and Test Python
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run tests
      run: python -m unittest discover tests/
      
  build-test-go:
    name: Build and Test Go
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '^1.20.1'
        
    - name: Build
      run: go build
      
    - name: Test
      run: go test ./...
      
  deploy-eks:
    name: Deploy to EKS
    needs: [build-test-python, build-test-go]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Deploy to EKS
      run: |
        aws eks update-cluster --name clusterchecksdk --version="1.28" --region=${{ env.AWS_REGION }}
        kubectl apply -f kubernetes/
        
  deploy-api-gateway:
    name: Deploy API Gateway
    needs: deploy-eks
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Deploy API Gateway
      run: |
        aws apigateway create-rest-api --name ghj --description "yftyghu" --endpoint-configuration Type=EDGE
        # Additional API Gateway deployment steps...